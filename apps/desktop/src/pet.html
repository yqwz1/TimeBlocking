<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 200px;
    height: 175px;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
    font-family: 'Segoe UI', sans-serif;
  }
  #stage {
    position: absolute;
    inset: 0;
    cursor: grab;
  }
  #stage.dragging { cursor: grabbing; }

  #bubble {
    position: absolute;
    top: 3px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    width: max-content;
    max-width: 174px;
    box-sizing: border-box;
    background: #fff8d8;
    border: 3px solid #2e2b3d;
    border-radius: 0;
    padding: 5px 8px 4px;
    box-shadow: 3px 3px 0 rgba(46, 43, 61, 0.42), inset 0 0 0 1px #f0c96c;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.25;
    color: #2e2b3d;
    text-align: center;
    white-space: normal;
    opacity: 0;
    transition: transform 0.18s steps(3, end), opacity 0.12s;
    pointer-events: none;
    z-index: 8;
    image-rendering: pixelated;
  }
  #stage.context-music #name-tag { border-color: #66e39b; box-shadow: 0 2px 0 #176b43; }
  #stage.context-youtube #name-tag { border-color: #ff6b62; box-shadow: 0 2px 0 #8c211c; }
  #stage.context-gaming #name-tag { border-color: #72d7ff; box-shadow: 0 2px 0 #185b76; }
  #stage.context-coding #name-tag { border-color: #f2d25e; box-shadow: 0 2px 0 #786619; }
  #bubble::before,
  #bubble::after {
    content: '';
    position: absolute;
    left: 50%;
    width: 0;
    height: 0;
    transform: translateX(-50%);
  }
  #bubble::before {
    bottom: -12px;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 11px solid #2e2b3d;
  }
  #bubble::after {
    bottom: -7px;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 7px solid #fff8d8;
  }
  #bubble.show {
    transform: translateX(-50%) scale(1);
    opacity: 1;
  }

  /* --- needs meters (shown on hover) --- */
  #meters {
    position: absolute;
    top: 4px;
    /* The drawn cat is fractionally left of its SVG viewBox centre. Keep the
       HUD and tag aligned to the visible sprite, not the 200px window. */
    left: calc(50% - 2px);
    transform: translateX(-50%);
    width: 88px;
    background: rgba(28, 30, 40, 0.88);
    border-radius: 8px;
    padding: 5px 7px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 5;
  }
  #meters.show { opacity: 1; }
  .meter-row {
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 3px 0;
  }
  .meter-row span { font-size: 10px; line-height: 1; }
  .track {
    flex: 1;
    height: 5px;
    background: rgba(255, 255, 255, 0.18);
    border-radius: 3px;
    overflow: hidden;
  }
  .fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
  #fill-hunger { background: #f59e0b; }
  #fill-energy { background: #60a5fa; }
  #fill-fun { background: #34d399; }

  /* --- props --- */
  #food {
    position: absolute;
    bottom: 8px;
    left: 20px;
    font-size: 24px;
    transform: scale(0);
    transform-origin: bottom center;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    z-index: 2;
  }
  #food.show { transform: scale(1); }

  #yarn {
    position: absolute;
    bottom: 10px;
    left: 88px;
    font-size: 22px;
    opacity: 0;
    transition: left 0.8s cubic-bezier(0.45, 0.05, 0.55, 0.95), opacity 0.25s;
    pointer-events: none;
    z-index: 2;
  }
  #yarn.show { opacity: 1; }
  #yarn.spin { animation: yarn-spin 0.8s linear infinite; }
  @keyframes yarn-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* --- cat (whole-frame pixel spritesheet) --- */
  #cat {
    position: absolute;
    bottom: 2px;
    left: 50%;
    width: 96px;
    height: 96px;
    margin-left: -48px;
    z-index: 3;
    transform-origin: 50% 100%;
  }
  #cat.flip { transform: scaleX(-1); }
  #cat-motion,
  #cat-sprite {
    position: absolute;
    inset: 0;
    width: 96px;
    height: 96px;
    transform-origin: 50% 100%;
  }
  #cat-sprite {
    background: url('./cat-sprites.svg') 0 0 / 2016px 96px no-repeat;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    animation: sprite-idle 4.8s steps(1, end) infinite;
  }

  /* All motion swaps complete 32x32 drawings. No head, paw, or tail can drift
     away from the body because those pieces no longer exist in the DOM. */
  .look-left #cat-sprite { animation: sprite-look-left 4.8s steps(1, end) infinite; }
  .look-right #cat-sprite { animation: sprite-look-right 4.8s steps(1, end) infinite; }
  .look-down #cat-sprite { animation: sprite-look-down 4.8s steps(1, end) infinite; }
  .walking #cat-sprite { animation: sprite-walk 0.42s steps(1, end) infinite; }
  .zoomies #cat-sprite { animation: sprite-walk 0.18s steps(1, end) infinite; }
  .sleeping #cat-sprite { animation: sprite-sleep 2.6s steps(1, end) infinite; }
  .sitting #cat-sprite { animation: none; background-position: -672px 0; }
  .begging #cat-sprite { animation: none; background-position: -864px 0; }
  .bored #cat-sprite { animation: sprite-bored 2.2s steps(1, end) infinite; }
  .stretching #cat-sprite { animation: sprite-stretch 1.8s steps(1, end); }
  .playing #cat-sprite,
  .mouse-playing #cat-sprite { animation: sprite-play 0.46s steps(1, end) infinite; }
  .eating #cat-sprite { animation: sprite-eat 0.55s steps(1, end) infinite; }
  .yawning #cat-sprite { animation: sprite-yawn 1.4s steps(1, end); }
  .pouncing #cat-sprite { animation: none; background-position: -1440px 0; }

  @keyframes sprite-idle {
    0%, 91%, 96%, 100% { background-position: 0 0; }
    92%, 95% { background-position: -1536px 0; }
  }
  @keyframes sprite-look-left {
    0%, 91%, 96%, 100% { background-position: -1728px 0; }
    92%, 95% { background-position: -1536px 0; }
  }
  @keyframes sprite-look-right {
    0%, 91%, 96%, 100% { background-position: -1824px 0; }
    92%, 95% { background-position: -1536px 0; }
  }
  @keyframes sprite-look-down {
    0%, 91%, 96%, 100% { background-position: -1920px 0; }
    92%, 95% { background-position: -1536px 0; }
  }
  @keyframes sprite-walk {
    0%, 100% { background-position: -96px 0; }
    25% { background-position: -192px 0; }
    50% { background-position: -288px 0; }
    75% { background-position: -384px 0; }
  }
  @keyframes sprite-sleep {
    0%, 49% { background-position: -480px 0; }
    50%, 100% { background-position: -576px 0; }
  }
  @keyframes sprite-bored {
    0%, 64%, 100% { background-position: -672px 0; }
    65%, 84% { background-position: -1632px 0; }
  }
  @keyframes sprite-stretch {
    0%, 19%, 81%, 100% { background-position: 0 0; }
    20%, 80% { background-position: -768px 0; }
  }
  @keyframes sprite-play {
    0%, 49%, 100% { background-position: -960px 0; }
    50%, 99% { background-position: -1056px 0; }
  }
  @keyframes sprite-eat {
    0%, 49%, 100% { background-position: -1152px 0; }
    50%, 99% { background-position: -1248px 0; }
  }
  @keyframes sprite-yawn {
    0%, 24%, 76%, 100% { background-position: -672px 0; }
    25%, 75% { background-position: -1632px 0; }
  }

  .happy #cat-motion { animation: wiggle 0.32s steps(1, end) 2; }
  @keyframes wiggle {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
  .petted #cat-motion { animation: pet-squash-stretch 0.62s steps(1, end); }
  @keyframes pet-squash-stretch {
    0%, 100% { transform: translate(0, 0) scale(1, 1); }
    18%, 36% { transform: translate(-2px, 4px) scale(1.18, 0.76); }
    54%, 72% { transform: translate(2px, -5px) scale(0.84, 1.22); }
    86% { transform: translate(0, 1px) scale(1.07, 0.94); }
  }

  #name-tag {
    position: absolute;
    left: calc(50% - 2px);
    bottom: 103px;
    transform: translateX(-50%);
    padding: 3px 7px 2px;
    color: #fff;
    background: rgba(15, 15, 18, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.38);
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.42);
    font-family: Consolas, 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.5px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 4;
    image-rendering: pixelated;
  }
  #name-editor {
    position: absolute;
    left: calc(50% - 2px);
    bottom: 100px;
    transform: translateX(-50%);
    width: 112px;
    box-sizing: border-box;
    padding: 3px 5px;
    color: #fff;
    background: #20202a;
    border: 2px solid #f2d25e;
    box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.42);
    outline: none;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.1;
    text-align: center;
    text-transform: uppercase;
    z-index: 9;
  }
  #name-editor[hidden] { display: none; }

  #cursor-toy {
    position: absolute;
    width: 8px;
    height: 8px;
    margin: -4px 0 0 -4px;
    background: #ffe067;
    border: 2px solid #6b4d10;
    box-sizing: border-box;
    transform: rotate(45deg) scale(0);
    transition: transform 0.14s steps(2, end);
    pointer-events: none;
    z-index: 7;
  }
  #cursor-toy.show { transform: rotate(45deg) scale(1); }
  .pouncing #cat-motion { animation: pounce 0.55s steps(1, end); }
  @keyframes pounce {
    0%, 100% { transform: translateY(0); }
    30%, 65% { transform: translateY(-15px); }
  }
  .jumping #cat-motion { animation: joyful-jump 0.82s steps(1, end); }
  @keyframes joyful-jump {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    12% { transform: translateY(3px) scale(1.08, 0.9); }
    38%, 58% { transform: translateY(-31px) scale(0.94, 1.06); }
    82% { transform: translateY(2px) scale(1.05, 0.93); }
  }

  /* Carry physics now moves the complete precomposed cat frame. */
  #stage.dragging #cat-motion {
    animation: none;
    transform: translate(var(--carry-x, 0px), var(--carry-y, 2px)) rotate(var(--carry-rotate, 0deg));
  }
  #stage.dragging #cat-sprite { animation: none; background-position: -1344px 0; }
  #stage.dragging #name-tag { opacity: 0; }

  #zzz {
    position: absolute;
    bottom: 92px;
    right: 30px;
    font-size: 14px;
    font-weight: 700;
    color: #7d8bd4;
    opacity: 0;
    pointer-events: none;
    z-index: 4;
  }
  #zzz.show { opacity: 1; }
  #zzz span {
    display: inline-block;
    animation: floatz 2.2s ease-in-out infinite;
  }
  #zzz span:nth-child(2) { animation-delay: 0.5s; font-size: 11px; }
  #zzz span:nth-child(3) { animation-delay: 1s; font-size: 9px; }
  @keyframes floatz {
    0% { transform: translate(0, 0); opacity: 0; }
    40% { opacity: 1; }
    100% { transform: translate(8px, -16px); opacity: 0; }
  }

  .heart {
    position: absolute;
    font-size: 14px;
    pointer-events: none;
    z-index: 6;
    animation: heart-up 1.1s ease-out forwards;
  }
  .expression {
    position: absolute;
    font-family: 'Segoe UI Emoji', sans-serif;
    font-size: 17px;
    line-height: 1;
    pointer-events: none;
    z-index: 7;
    filter: drop-shadow(1px 2px 0 rgba(46, 43, 61, 0.28));
    animation: expression-pop 1.25s cubic-bezier(0.2, 0.75, 0.25, 1) forwards;
  }
  @keyframes expression-pop {
    0% { transform: translate(0, 0) scale(0.08, 0.72) rotate(0deg); opacity: 0; }
    12% { transform: translate(var(--dx1), var(--dy1)) scale(1.1, 0.25); opacity: 1; }
    32% { transform: translate(var(--dx3), var(--dy3)) scale(1); opacity: 1; }
    76% { transform: translate(var(--dx8), var(--dy8)) scale(0.7); opacity: 0.9; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.08) rotate(var(--spin)); opacity: 0; }
  }
  @keyframes heart-up {
    0% { transform: translateY(0) scale(0.6); opacity: 1; }
    100% { transform: translateY(-42px) scale(1.15); opacity: 0; }
  }
  .crumb {
    position: absolute;
    font-size: 10px;
    pointer-events: none;
    z-index: 6;
    animation: crumb-fall 0.8s ease-in forwards;
  }
  @keyframes crumb-fall {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(14px); opacity: 0; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble"></div>
  <div id="meters">
    <div class="meter-row"><span>🍗</span><div class="track"><div class="fill" id="fill-hunger"></div></div></div>
    <div class="meter-row"><span>⚡</span><div class="track"><div class="fill" id="fill-energy"></div></div></div>
    <div class="meter-row"><span>🧶</span><div class="track"><div class="fill" id="fill-fun"></div></div></div>
  </div>
  <div id="food">🍗</div>
  <div id="yarn">🧶</div>
  <div id="name-tag">MILO</div>
  <input id="name-editor" hidden maxlength="16" aria-label="Pet name" />
  <div id="cursor-toy"></div>
  <div id="cat" role="img" aria-label="Milo the desktop cat">
    <div id="cat-motion"><div id="cat-sprite"></div></div>
  </div>
  <div id="zzz"><span>z</span><span>z</span><span>z</span></div>
</div>
<script>
  // In Electron the preload exposes window.pet; the no-op fallback keeps the
  // page previewable in a plain browser.
  const petApi = window.pet ?? {
    getBounds: async () => null,
    setPosition: () => {},
    openApp: () => {},
    showMenu: () => {},
    renameComplete: () => {},
    onDo: () => {},
    onCursor: () => {},
    onContext: () => {},
    onPlayful: () => {},
    onRename: () => {},
  };

  const stage = document.getElementById('stage');
  const cat = document.getElementById('cat');
  const bubble = document.getElementById('bubble');
  const zzz = document.getElementById('zzz');
  const meters = document.getElementById('meters');
  const food = document.getElementById('food');
  const yarn = document.getElementById('yarn');
  const cursorToy = document.getElementById('cursor-toy');
  const nameTag = document.getElementById('name-tag');
  const nameEditor = document.getElementById('name-editor');

  const WIN_W = 200;
  const CAT_CENTER = WIN_W / 2;
  const CARRY_ANCHOR_X = 92;
  const CARRY_ANCHOR_Y = 131;

  const MESSAGES = [
    'You got this! 💪',
    'One task at a time 🐾',
    'Hydration check 💧',
    'Stretch break soon?',
    'Meow! Keep going ✨',
    'Deep breath... focus 🧘',
    'Proud of you!',
    'Eyes off screen for 20s? 👀',
    'Small steps count 🐾',
  ];
  const PET_REACTIONS = ['Purrrr 💛', 'Meow! 😺', '*happy wiggle*', 'More pets pls', 'I caught you a bug! 🐛'];

  const CONTEXT_CLASSES = ['context-music', 'context-youtube', 'context-gaming', 'context-coding', 'context-work', 'context-meeting'];
  const BROWSERS = ['chrome', 'msedge', 'firefox', 'brave', 'opera', 'vivaldi'];
  const GAME_APPS = [
    'steam', 'steamwebhelper', 'epicgameslauncher', 'riotclientservices', 'battle.net',
    'minecraft', 'robloxplayerbeta', 'valorant', 'fortniteclient-win64-shipping',
    'leagueclient', 'overwatch', 'cs2', 'gta5', 'eldenring', 'rocketleague',
  ];

  function cleanMediaTitle(title) {
    return title
      .replace(/\s*[-|–—]\s*(YouTube Music|YouTube|Spotify|VLC media player).*$/i, '')
      .replace(/^Spotify(?: Premium)?$/i, '')
      .trim()
      .slice(0, 34);
  }

  function classifyApp(context) {
    if (!context) return { type: 'other', label: '' };
    const processName = context.process.toLowerCase();
    const title = context.title.toLowerCase();
    const label = cleanMediaTitle(context.title);
    const fullscreen = workArea && context.width >= workArea.width && context.height >= workArea.height;

    if (processName.includes('spotify') || /youtube music|tidal|deezer|apple music/.test(title) || ['musicbee', 'vlc', 'foobar2000'].includes(processName)) {
      return { type: 'music', label };
    }
    if (title.includes('youtube') || title.includes('twitch')) return { type: 'youtube', label };
    if (GAME_APPS.some((game) => processName.includes(game)) || /minecraft|roblox|valorant|fortnite|league of legends/.test(title) || (fullscreen && !BROWSERS.includes(processName))) {
      return { type: 'gaming', label };
    }
    if (context.media?.process === 'spotify') return { type: 'music', label: cleanMediaTitle(context.media.title) };
    if (['code', 'cursor', 'devenv', 'idea64', 'webstorm64', 'pycharm64', 'rider64'].some((app) => processName.includes(app))) {
      return { type: 'coding', label };
    }
    if (/timeblock/i.test(context.title)) return { type: 'work', label: 'TimeBlock' };
    if (['zoom', 'teams', 'discord', 'slack'].some((app) => processName.includes(app))) return { type: 'meeting', label };
    if (['winword', 'excel', 'powerpnt', 'onenote', 'notion'].some((app) => processName.includes(app))) return { type: 'work', label };
    return { type: 'other', label };
  }

  // ============ needs ============
  // hunger/energy/fun: 100 = fully satisfied. Persisted across restarts.
  const NEEDS_KEY = 'tb.pet.needs';
  let needs = { hunger: 80, energy: 90, fun: 70 };
  try {
    const saved = JSON.parse(localStorage.getItem(NEEDS_KEY));
    if (saved && typeof saved.hunger === 'number') {
      needs = { hunger: saved.hunger, energy: saved.energy, fun: saved.fun };
      // Apply offline decay, capped so the cat is never starving after a weekend.
      const awayMin = Math.min((Date.now() - (saved.at || Date.now())) / 60000, 300);
      needs.hunger = Math.max(15, needs.hunger - awayMin * 0.3);
      needs.fun = Math.max(15, needs.fun - awayMin * 0.3);
      needs.energy = Math.min(100, needs.energy + awayMin * 0.5); // it napped while you were gone
    }
  } catch {}
  const clamp01 = (v) => Math.min(100, Math.max(0, v));
  function saveNeeds() {
    try { localStorage.setItem(NEEDS_KEY, JSON.stringify({ ...needs, at: Date.now() })); } catch {}
  }
  function renderMeters() {
    document.getElementById('fill-hunger').style.width = needs.hunger + '%';
    document.getElementById('fill-energy').style.width = needs.energy + '%';
    document.getElementById('fill-fun').style.width = needs.fun + '%';
  }
  renderMeters();

  // ============ pet name ============
  const PET_NAME_KEY = 'tb.pet.name';
  let petName = 'Milo';
  try {
    const savedName = localStorage.getItem(PET_NAME_KEY)?.trim();
    if (savedName) petName = savedName.slice(0, 16);
  } catch {}
  function renderPetName() {
    nameTag.textContent = petName.toUpperCase();
    nameTag.title = `${petName} — right-click and choose Rename pet`;
  }
  function finishRename(save) {
    if (nameEditor.hidden) return;
    const nextName = nameEditor.value.trim().replace(/\s+/g, ' ').slice(0, 16);
    if (save && nextName) {
      petName = nextName;
      try { localStorage.setItem(PET_NAME_KEY, petName); } catch {}
      renderPetName();
    }
    nameEditor.hidden = true;
    nameTag.hidden = false;
    petApi.renameComplete();
  }
  function beginRename() {
    if (!nameEditor.hidden) return;
    nameEditor.value = petName;
    nameTag.hidden = true;
    nameEditor.hidden = false;
    requestAnimationFrame(() => {
      nameEditor.focus();
      nameEditor.select();
    });
  }
  nameEditor.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') finishRename(true);
    if (event.key === 'Escape') finishRename(false);
  });
  nameEditor.addEventListener('mousedown', (event) => event.stopPropagation());
  nameEditor.addEventListener('blur', () => finishRename(true));
  renderPetName();

  // ============ window position (the pet walks by moving its own window) ============
  let winX = 0, winY = 0, workArea = null, platforms = [];
  let ready = false;

  async function refreshBounds() {
    const b = await petApi.getBounds();
    if (!b) return;
    winX = b.x; winY = b.y; workArea = b.workArea; platforms = b.platforms || [];
    ready = true;
  }
  refreshBounds();

  function moveWindow(x, y, crossDisplays = false) {
    if (workArea && !crossDisplays) {
      x = Math.min(Math.max(x, workArea.x - 30), workArea.x + workArea.width - WIN_W + 30);
      y = Math.min(Math.max(y, workArea.y), workArea.y + workArea.height - 175);
    }
    winX = x; winY = y;
    petApi.setPosition(Math.round(x), Math.round(y), crossDisplays);
  }

  // ============ speech bubble ============
  let bubbleTimer = null;
  function say(text, ms = 3500) {
    bubble.textContent = text;
    bubble.classList.add('show');
    if (bubbleTimer) clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms);
  }

  // ============ state machine ============
  const VISUAL_CLASSES = ['walking', 'sleeping', 'sitting', 'bored', 'begging', 'eating', 'playing', 'zoomies', 'stretching', 'mouse-playing', 'jumping'];
  let state = 'idle';
  let playfulMode = true;
  let facing = 1; // 1 = right, -1 = left
  let stateTimer = null;
  let moveTimer = null;
  let fallTimer = null;
  let busy = false;       // interactive sequence (eat/play) in progress
  let afkSleeping = false;
  let dragging = false;
  let carryFrame = null;
  let carryLastTime = 0;
  let carryLastPointerTime = 0;
  let carryLastCursorX = 0;
  let carryLastCursorY = 0;
  let carryTargetX = 0;
  let carryTargetY = 2;
  let carryTargetRotate = 0;
  let carryX = 0;
  let carryY = 2;
  let carryRotate = 0;
  let carryVelocityX = 0;
  let carryVelocityY = 0;
  let carryAngularVelocity = 0;

  function setFacing(dir) {
    facing = dir;
    // The unmirrored sprite faces left (its tail is drawn on the right), so
    // only mirror it while moving or looking right.
    cat.classList.toggle('flip', dir === 1);
  }

  function clearMovement() {
    if (moveTimer) { clearInterval(moveTimer); moveTimer = null; }
  }

  function clearFalling() {
    if (fallTimer) { clearInterval(fallTimer); fallTimer = null; }
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function renderCarryPose() {
    // The complete sprite may be mirrored, so compensate here to keep its
    // spring lag opposite to the actual pointer movement in either direction.
    cat.style.setProperty('--carry-x', `${(carryX * facing).toFixed(2)}px`);
    cat.style.setProperty('--carry-y', `${carryY.toFixed(2)}px`);
    cat.style.setProperty('--carry-rotate', `${(carryRotate * facing).toFixed(2)}deg`);
  }

  function runCarryPhysics(now) {
    const dt = Math.min((now - (carryLastTime || now)) / 1000, 0.034);
    carryLastTime = now;
    const spring = dragging ? 92 : 135;
    const damping = dragging ? 15 : 19;

    carryVelocityX += (carryTargetX - carryX) * spring * dt;
    carryVelocityY += (carryTargetY - carryY) * spring * dt;
    carryAngularVelocity += (carryTargetRotate - carryRotate) * spring * dt;
    const decay = Math.exp(-damping * dt);
    carryVelocityX *= decay;
    carryVelocityY *= decay;
    carryAngularVelocity *= decay;
    carryX += carryVelocityX * dt;
    carryY += carryVelocityY * dt;
    carryRotate += carryAngularVelocity * dt;
    renderCarryPose();

    const settled = !dragging
      && Math.abs(carryX) < 0.05 && Math.abs(carryY) < 0.05 && Math.abs(carryRotate) < 0.1
      && Math.abs(carryVelocityX) < 0.1 && Math.abs(carryVelocityY) < 0.1;
    if (settled) {
      carryFrame = null;
      carryX = 0; carryY = 0; carryRotate = 0;
      renderCarryPose();
      return;
    }
    carryFrame = requestAnimationFrame(runCarryPhysics);
  }

  function startCarryPhysics(cursorX, cursorY) {
    if (carryFrame) cancelAnimationFrame(carryFrame);
    carryLastCursorX = cursorX;
    carryLastCursorY = cursorY;
    carryLastTime = performance.now();
    carryLastPointerTime = carryLastTime;
    carryTargetX = 0;
    carryTargetY = 3;
    carryTargetRotate = 0;
    carryFrame = requestAnimationFrame(runCarryPhysics);
  }

  function aimCarryPhysics(cursorX, cursorY) {
    const now = performance.now();
    const dt = Math.max((now - carryLastPointerTime) / 1000, 1 / 120);
    const pointerVX = (cursorX - carryLastCursorX) / dt;
    const pointerVY = (cursorY - carryLastCursorY) / dt;
    carryLastCursorX = cursorX;
    carryLastCursorY = cursorY;
    carryLastPointerTime = now;
    carryTargetX = clamp(-pointerVX * 0.012, -7, 7);
    carryTargetY = clamp(3 - pointerVY * 0.008, -1, 8);
    carryTargetRotate = clamp(-pointerVX * 0.03, -17, 17);
  }

  function releaseCarryPhysics() {
    carryTargetX = 0;
    carryTargetY = 0;
    carryTargetRotate = 0;
    carryLastTime = performance.now();
    if (!carryFrame) carryFrame = requestAnimationFrame(runCarryPhysics);
  }

  // The pet window is normally grounded at the bottom of its display. When
  // the user lets go after moving it higher, apply a small gravity simulation
  // rather than snapping it down, so it visibly falls back to the desktop.
  function startFalling() {
    clearFalling();
    if (!ready || !workArea) return;

    const desktopGroundY = workArea.y + workArea.height - 175;
    const footX1 = winX + 60;
    const footX2 = winX + 140;
    const currentFeetY = winY + 175;
    const platformTops = platforms
      .filter((rect) => rect.y >= currentFeetY - 18 && rect.y < workArea.y + workArea.height)
      .filter((rect) => footX2 > rect.x + 8 && footX1 < rect.x + rect.width - 8)
      .map((rect) => rect.y - 175);
    const groundY = Math.min(desktopGroundY, ...platformTops);
    if (winY >= groundY - 1) {
      if (groundY < winY) moveWindow(winX, groundY);
      return;
    }

    let velocity = 0;
    let last = performance.now();
    fallTimer = setInterval(() => {
      if (dragging) { last = performance.now(); return; }

      const now = performance.now();
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      velocity = Math.min(velocity + 1900 * dt, 1500);
      const nextY = Math.min(winY + velocity * dt, groundY);
      moveWindow(winX, nextY);

      if (nextY >= groundY) clearFalling();
    }, 16);
  }

  function setState(next) {
    state = next;
    for (const c of VISUAL_CLASSES) cat.classList.remove(c);
    clearMovement();
    zzz.classList.remove('show');
    switch (next) {
      case 'walk':
        cat.classList.add('walking');
        startRoaming(38);
        break;
      case 'zoomies':
        cat.classList.add('zoomies');
        spawnExpressions(['⚡', '✨'], 3);
        startRoaming(170);
        break;
      case 'sleep':
        cat.classList.add('sleeping');
        zzz.classList.add('show');
        spawnExpressions(['💤', '🌙'], 2);
        break;
      case 'sit':
        cat.classList.add('sitting');
        break;
      case 'bored':
        cat.classList.add('bored');
        spawnExpressions(['🥱', '💭'], 2);
        yawnOnce();
        break;
      case 'beg':
        cat.classList.add('begging');
        spawnExpressions(['🍗', '🥺'], 2);
        break;
      case 'stretch':
        cat.classList.add('stretching');
        break;
      case 'jump':
        cat.classList.add('jumping');
        spawnExpressions(['✨', '🐾'], 2);
        break;
      case 'chase':
        cat.classList.add('walking');
        startChasing();
        break;
    }
  }

  function yawnOnce() {
    cat.classList.remove('yawning');
    void cat.offsetWidth;
    cat.classList.add('yawning');
    setTimeout(() => cat.classList.remove('yawning'), 1500);
  }

  function startRoaming(speed) {
    if (!ready || !workArea) return;
    let last = performance.now();
    moveTimer = setInterval(() => {
      if (dragging) { last = performance.now(); return; }
      const now = performance.now();
      const dt = (now - last) / 1000;
      last = now;
      let nx = winX + facing * speed * dt;
      const minX = workArea.x + 4;
      const maxX = workArea.x + workArea.width - WIN_W - 4;
      if (nx <= minX) { nx = minX; setFacing(1); }
      if (nx >= maxX) { nx = maxX; setFacing(-1); }
      moveWindow(nx, winY);
    }, 33);
  }

  // ============ cursor: eye tracking + chasing + AFK sleep ============
  let cursor = null;   // absolute screen coords
  let idleSec = 0;

  petApi.onCursor((c) => {
    cursor = c;
    idleSec = c.idle || 0;
    updatePupils();
  });

  petApi.onPlayful((enabled) => {
    playfulMode = enabled;
    if (!enabled && ['jump', 'chase', 'zoomies'].includes(state)) {
      setState('idle');
      scheduleSoon(3000);
    }
    if (!enabled) stopMousePlay();
  });

  // ============ foreground app awareness ============
  let activeContext = { type: 'other', label: '' };
  let contextReactionTimer = null;
  let lastContextKey = '';
  let lastContextType = 'other';
  let lastContextReactionAt = 0;

  function reactToContext(context) {
    activeContext = context;
    for (const className of CONTEXT_CLASSES) stage.classList.remove(className);
    if (context.type !== 'other') stage.classList.add(`context-${context.type}`);

    const key = `${context.type}:${context.label}`;
    const categoryChanged = context.type !== lastContextType;
    if (context.type === 'other' || key === lastContextKey) return;
    if (!categoryChanged && Date.now() - lastContextReactionAt < 30000) return;

    lastContextKey = key;
    lastContextType = context.type;
    lastContextReactionAt = Date.now();
    const label = context.label || '';
    if (context.type === 'music') {
      say(label ? `Now playing: ${label} 🎵` : 'Music time! I can feel the beat 🎵', 4200);
      spawnExpressions(['🎵', '🎶', '💿'], 5);
    } else if (context.type === 'youtube') {
      say(label ? `Watching ${label}? I’ll guard the controls!` : 'YouTube time! 🍿', 4200);
      spawnExpressions(['🍿', '▶️', '✨'], 4);
    } else if (context.type === 'gaming') {
      say('Game mode! I’ve got your back 🎮', 3600);
      spawnExpressions(['🎮', '🔥', '⚡'], 5);
    } else if (context.type === 'coding') {
      say('Coding time. Tiny paws, big focus! 💻', 3600);
      spawnExpressions(['💻', '⌨️', '✨'], 3);
    } else if (context.type === 'meeting') {
      say('Shh... meeting mode 🤫', 3000);
      spawnExpressions(['🤫', '💬'], 2);
    } else if (context.type === 'work') {
      say('Focus mode! One step at a time 🐾', 3400);
      spawnExpressions(['✅', '🐾'], 3);
    }
  }

  petApi.onContext((app) => {
    if (contextReactionTimer) clearTimeout(contextReactionTimer);
    const context = classifyApp(app);
    contextReactionTimer = setTimeout(() => reactToContext(context), 2500);
  });

  setInterval(() => {
    if (busy || state === 'sleep') return;
    if (activeContext.type === 'music') spawnExpressions(['🎵', '🎶'], 2);
    if (activeContext.type === 'youtube') spawnExpressions(['🍿', '✨'], 2);
    if (activeContext.type === 'gaming') spawnExpressions(['⚡', '🔥'], 2);
    if (activeContext.type === 'coding') spawnExpressions(['💻', '✨'], 2);
  }, 12000);

  function updatePupils() {
    cat.classList.remove('look-left', 'look-right', 'look-down');
    if (!cursor || !ready || state !== 'idle' || busy || dragging) return;
    const dx = cursor.x - (winX + CAT_CENTER);
    const dy = cursor.y - (winY + 118);
    if (Math.abs(dy) > Math.abs(dx) * 1.1) {
      if (dy > 8) cat.classList.add('look-down');
      return;
    }
    if (Math.abs(dx) < 8) return;
    // Facing mirrors the complete sheet, so choose the corresponding local
    // gaze frame instead of moving eye elements independently.
    const localDx = dx * (cat.classList.contains('flip') ? -1 : 1);
    cat.classList.add(localDx < 0 ? 'look-left' : 'look-right');
  }

  let chaseNear = 0;
  function startChasing() {
    if (!ready || !workArea) return;
    let last = performance.now();
    chaseNear = 0;
    moveTimer = setInterval(() => {
      if (dragging || !cursor) { last = performance.now(); return; }
      const now = performance.now();
      const dt = (now - last) / 1000;
      last = now;
      const diff = cursor.x - (winX + CAT_CENTER);
      if (Math.abs(diff) < 55) {
        chaseNear += dt;
        if (chaseNear > 0.6) { pounce(); return; }
        return;
      }
      chaseNear = 0;
      setFacing(diff > 0 ? 1 : -1);
      moveWindow(winX + Math.sign(diff) * 95 * dt, winY);
    }, 33);
  }

  function pounce() {
    clearMovement();
    cat.classList.remove('walking', 'pouncing');
    void cat.offsetWidth;
    cat.classList.add('pouncing');
    spawnHearts(CAT_CENTER, 60);
    spawnExpressions(['🐾', '✨'], 3);
    say('Gotcha! 🐾', 1800);
    needs.fun = clamp01(needs.fun + 15);
    setTimeout(() => {
      cat.classList.remove('pouncing');
      if (!busy) { setState('idle'); scheduleSoon(3000); }
    }, 600);
  }

  // ============ behavior scheduler ============
  function pickState() {
    if (needs.energy <= 15) return 'sleep';
    if (needs.hunger <= 20) return 'beg';
    if (needs.fun <= 20) return playfulMode && Math.random() < 0.5 ? 'zoomies' : 'bored';
    const pool = ['idle', 'idle', 'idle', 'walk', 'walk', 'walk', 'sit', 'sit', 'stretch'];
    if (needs.energy < 50) pool.push('sleep', 'sleep');
    if (needs.fun < 45) pool.push('bored');
    if (playfulMode && needs.energy > 30) pool.push('jump');
    if (playfulMode && needs.fun > 35 && cursor && Math.random() < 0.35) pool.push('chase', 'chase');
    if (playfulMode && needs.fun > 55) pool.push('zoomies');
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function durationFor(s) {
    switch (s) {
      case 'sleep': return 20000 + Math.random() * 25000;
      case 'walk': return 5000 + Math.random() * 6000;
      case 'sit': return 5000 + Math.random() * 6000;
      case 'bored': return 5000;
      case 'beg': return 6000;
      case 'stretch': return 2000;
      case 'jump': return 1100;
      case 'zoomies': return 3500 + Math.random() * 2000;
      case 'chase': return 8000;
      default: return 4000 + Math.random() * 6000;
    }
  }

  function scheduleSoon(ms) {
    if (stateTimer) clearTimeout(stateTimer);
    stateTimer = setTimeout(tickBehavior, ms);
  }

  function tickBehavior() {
    if (busy || afkSleeping || dragging) { scheduleSoon(2000); return; }
    const next = pickState();
    setState(next);
    if (next === 'beg') say('I’m hungry! Right-click → Feed 🍗', 4500);
    if (next === 'bored') say(['Sooo bored… 🥱', 'Play with me? 🧶', '*stares at you*'][Math.floor(Math.random() * 3)], 3500);
    scheduleSoon(durationFor(next));
  }
  scheduleSoon(2500);

  // ============ needs decay + AFK sleep ============
  setInterval(() => {
    const sleeping = state === 'sleep';
    if (sleeping) {
      needs.energy = clamp01(needs.energy + 0.6);
      needs.hunger = clamp01(needs.hunger - 0.03);
    } else {
      needs.hunger = clamp01(needs.hunger - 0.07);
      needs.fun = clamp01(needs.fun - 0.09);
      needs.energy = clamp01(needs.energy - 0.045);
    }
    renderMeters();

    // Sleep when the user has been away from the keyboard for 4+ minutes.
    if (!afkSleeping && idleSec > 240 && !busy) {
      afkSleeping = true;
      if (stateTimer) clearTimeout(stateTimer);
      setState('sleep');
    } else if (afkSleeping && idleSec < 3) {
      afkSleeping = false;
      setState('idle');
      say('Welcome back! 👋', 3000);
      needs.energy = clamp01(needs.energy + 10);
      scheduleSoon(3000);
    }
  }, 5000);
  setInterval(saveNeeds, 30000);
  window.addEventListener('beforeunload', saveNeeds);

  // ============ feeding ============
  function startFeed() {
    if (busy) return;
    if (needs.hunger > 92) { say('I’m full! 😸', 2500); return; }
    busy = true;
    if (stateTimer) clearTimeout(stateTimer);
    setState('idle');
    setFacing(-1); // the food bowl is on the left
    food.style.transform = '';
    food.classList.add('show');
    setTimeout(() => cat.classList.add('eating'), 400);
    let bites = 0;
    const biteTimer = setInterval(() => {
      bites++;
      spawnCrumbs(34, 138);
      food.style.transform = `scale(${Math.max(0, 1 - bites * 0.33)})`;
      if (bites >= 3) {
        clearInterval(biteTimer);
        cat.classList.remove('eating');
        food.classList.remove('show');
        needs.hunger = 100;
        needs.energy = clamp01(needs.energy + 8);
        renderMeters();
        spawnHearts(CAT_CENTER, 60);
        spawnExpressions(['😋', '✨', '💛'], 4);
        say('Yum! 😋', 2500);
        busy = false;
        scheduleSoon(3000);
      }
    }, 900);
  }

  // ============ playing (yarn ball) ============
  function startPlay() {
    if (busy) return;
    busy = true;
    if (stateTimer) clearTimeout(stateTimer);
    setState('idle');
    cat.classList.add('playing');
    yarn.classList.add('show', 'spin');
    let side = 0;
    const hop = () => {
      side = 1 - side;
      yarn.style.left = side ? '150px' : '24px';
      setFacing(side ? 1 : -1);
    };
    hop();
    const hopTimer = setInterval(hop, 900);
    setTimeout(() => {
      clearInterval(hopTimer);
      cat.classList.remove('playing');
      yarn.classList.remove('show', 'spin');
      needs.fun = 100;
      needs.energy = clamp01(needs.energy - 8);
      renderMeters();
      spawnHearts(CAT_CENTER, 60);
      spawnExpressions(['🎵', '🎶', '✨'], 5);
      say('That was fun! 🐾', 2500);
      busy = false;
      scheduleSoon(3000);
    }, 6500);
  }

  petApi.onDo((action) => {
    if (action === 'feed') startFeed();
    if (action === 'play') startPlay();
  });
  petApi.onRename(beginRename);

  // ============ particles ============
  function spawnExpressions(emojis, count = 3, x = CAT_CENTER, y = 92) {
    for (let i = 0; i < count; i++) {
      const particle = document.createElement('div');
      const dx = (Math.random() < 0.5 ? -1 : 1) * (28 + Math.random() * 48);
      const dy = -(34 + Math.random() * 52);
      particle.className = 'expression';
      particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      particle.style.left = (x - 8 + (Math.random() * 18 - 9)) + 'px';
      particle.style.top = (y - 8 + Math.random() * 10) + 'px';
      particle.style.setProperty('--dx', dx + 'px');
      particle.style.setProperty('--dy', dy + 'px');
      particle.style.setProperty('--dx1', (dx * 0.08) + 'px');
      particle.style.setProperty('--dy1', (dy * 0.08) + 'px');
      particle.style.setProperty('--dx3', (dx * 0.3) + 'px');
      particle.style.setProperty('--dy3', (dy * 0.3) + 'px');
      particle.style.setProperty('--dx8', (dx * 0.78) + 'px');
      particle.style.setProperty('--dy8', (dy * 0.78) + 'px');
      particle.style.setProperty('--spin', ((Math.random() * 70 - 35)) + 'deg');
      particle.style.animationDelay = (i * 0.1) + 's';
      stage.appendChild(particle);
      setTimeout(() => particle.remove(), 1600 + i * 100);
    }
  }

  function spawnHearts(x, y) {
    for (let i = 0; i < 3; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = '💛';
      h.style.left = (x - 8 + (Math.random() * 30 - 15)) + 'px';
      h.style.top = (y - 10 - Math.random() * 10) + 'px';
      h.style.animationDelay = (i * 0.12) + 's';
      stage.appendChild(h);
      setTimeout(() => h.remove(), 1400);
    }
  }
  function spawnCrumbs(x, y) {
    for (let i = 0; i < 2; i++) {
      const c = document.createElement('div');
      c.className = 'crumb';
      c.textContent = '•';
      c.style.color = '#c98a3d';
      c.style.left = (x + Math.random() * 14) + 'px';
      c.style.top = (y + Math.random() * 6) + 'px';
      stage.appendChild(c);
      setTimeout(() => c.remove(), 900);
    }
  }

  // ============ petting (click) ============
  function petTheCat(x, y) {
    if (state === 'sleep' && !afkSleeping) {
      if (stateTimer) clearTimeout(stateTimer);
      setState('idle');
      scheduleSoon(5000);
    }
    cat.classList.remove('happy', 'petted');
    void cat.offsetWidth;
    cat.classList.add('happy', 'petted');
    setTimeout(() => cat.classList.remove('petted'), 650);
    spawnHearts(x, y);
    spawnExpressions(['💛', '💕', '✨'], 4, x, y);
    needs.fun = clamp01(needs.fun + 6);
    renderMeters();
    say(PET_REACTIONS[Math.floor(Math.random() * PET_REACTIONS.length)], 2000);
  }

  // ============ dragging vs clicking ============
  let dragMoved = false;
  let startCursorX = 0, startCursorY = 0;

  stage.addEventListener('mousedown', async (e) => {
    if (e.button !== 0) return;
    clearFalling();
    await refreshBounds();
    dragging = true; dragMoved = false;
    startCursorX = e.screenX; startCursorY = e.screenY;
    stage.classList.add('dragging');
    startCarryPhysics(e.screenX, e.screenY);
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.screenX - startCursorX;
    const dy = e.screenY - startCursorY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
    if (dragMoved) {
      aimCarryPhysics(e.screenX, e.screenY);
      // Once lifted, the pointer holds the scruff instead of the original
      // clicked pixel, matching the way a desktop pet is picked up by its neck.
      moveWindow(e.screenX - CARRY_ANCHOR_X, e.screenY - CARRY_ANCHOR_Y, true);
    }
  });
  window.addEventListener('mouseup', (e) => {
    if (!dragging) return;
    dragging = false;
    stage.classList.remove('dragging');
    releaseCarryPhysics();
    if (dragMoved) {
      // Pick up the final, clamped position (and a possible new display) before
      // calculating the floor for gravity.
      void refreshBounds().then(startFalling);
    } else {
      petTheCat(e.clientX, e.clientY);
    }
  });

  stage.addEventListener('dblclick', () => petApi.openApp());
  stage.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    petApi.showMenu();
  });

  // ============ hover meters ============
  let metersTimer = null;
  let hoverPlayTimer = null;
  let mousePlayTimer = null;
  let mousePlaying = false;

  function stopMousePlay() {
    if (hoverPlayTimer) { clearTimeout(hoverPlayTimer); hoverPlayTimer = null; }
    if (mousePlayTimer) { clearInterval(mousePlayTimer); mousePlayTimer = null; }
    cursorToy.classList.remove('show');
    cat.classList.remove('mouse-playing', 'pouncing');
    if (mousePlaying) {
      mousePlaying = false;
      busy = false;
      setState('idle');
      scheduleSoon(2500);
    }
  }

  function startMousePlay() {
    hoverPlayTimer = null;
    if (!playfulMode || dragging || busy || state === 'sleep') return;
    mousePlaying = true;
    busy = true;
    if (stateTimer) clearTimeout(stateTimer);
    setState('idle');
    cat.classList.add('mouse-playing');
    cursorToy.classList.add('show');
    say('A tiny firefly!', 1800);
    needs.fun = clamp01(needs.fun + 3);
    renderMeters();
    mousePlayTimer = setInterval(() => {
      cat.classList.remove('pouncing');
      void cat.offsetWidth;
      cat.classList.add('pouncing');
      setTimeout(() => cat.classList.remove('pouncing'), 280);
    }, 850);
  }

  stage.addEventListener('mousemove', (e) => {
    cursor = { x: e.screenX, y: e.screenY, idle: idleSec };
    updatePupils();
    cursorToy.style.left = e.clientX + 'px';
    cursorToy.style.top = e.clientY + 'px';
    if (mousePlaying) setFacing(e.clientX >= CAT_CENTER ? 1 : -1);
  });
  stage.addEventListener('mouseenter', () => {
    meters.classList.add('show');
    if (metersTimer) clearTimeout(metersTimer);
  });
  cat.addEventListener('mouseenter', () => {
    if (playfulMode && !hoverPlayTimer && !mousePlaying) hoverPlayTimer = setTimeout(startMousePlay, 2000);
  });
  stage.addEventListener('mouseleave', () => {
    metersTimer = setTimeout(() => meters.classList.remove('show'), 400);
    stopMousePlay();
  });

  // ============ ambient chatter ============
  function scheduleMessage() {
    setTimeout(() => {
      if (state !== 'sleep' && !busy) say(MESSAGES[Math.floor(Math.random() * MESSAGES.length)]);
      scheduleMessage();
    }, 180000 + Math.random() * 180000);
  }
  scheduleMessage();
  setTimeout(() => say('Hi! I’ll keep you company 🐾', 4000), 900);

  // Work-area geometry can change (resolution, taskbar) — refresh periodically.
  setInterval(refreshBounds, 60000);

  // Manual hooks for debugging/preview outside Electron.
