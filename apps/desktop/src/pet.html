<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 200px;
    height: 175px;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
    font-family: 'Segoe UI', sans-serif;
  }
  #stage {
    position: absolute;
    inset: 0;
    cursor: grab;
  }
  #stage.dragging { cursor: grabbing; }

  #bubble {
    position: absolute;
    top: 2px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    max-width: 180px;
    background: #fffdf7;
    border: 2px solid #3a3a3a;
    border-radius: 10px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 600;
    color: #3a3a3a;
    text-align: center;
    white-space: normal;
    opacity: 0;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
    pointer-events: none;
    z-index: 6;
  }
  #bubble.show {
    transform: translateX(-50%) scale(1);
    opacity: 1;
  }

  /* --- needs meters (shown on hover) --- */
  #meters {
    position: absolute;
    top: 4px;
    left: 6px;
    width: 88px;
    background: rgba(28, 30, 40, 0.88);
    border-radius: 8px;
    padding: 5px 7px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 5;
  }
  #meters.show { opacity: 1; }
  .meter-row {
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 3px 0;
  }
  .meter-row span { font-size: 10px; line-height: 1; }
  .track {
    flex: 1;
    height: 5px;
    background: rgba(255, 255, 255, 0.18);
    border-radius: 3px;
    overflow: hidden;
  }
  .fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
  #fill-hunger { background: #f59e0b; }
  #fill-energy { background: #60a5fa; }
  #fill-fun { background: #34d399; }

  /* --- props --- */
  #food {
    position: absolute;
    bottom: 8px;
    left: 20px;
    font-size: 24px;
    transform: scale(0);
    transform-origin: bottom center;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    z-index: 2;
  }
  #food.show { transform: scale(1); }

  #yarn {
    position: absolute;
    bottom: 10px;
    left: 88px;
    font-size: 22px;
    opacity: 0;
    transition: left 0.8s cubic-bezier(0.45, 0.05, 0.55, 0.95), opacity 0.25s;
    pointer-events: none;
    z-index: 2;
  }
  #yarn.show { opacity: 1; }
  #yarn.spin { animation: yarn-spin 0.8s linear infinite; }
  @keyframes yarn-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* --- cat (pixel sprite) --- */
  #cat {
    position: absolute;
    bottom: 2px;
    left: 50%;
    width: 96px;
    height: 96px;
    margin-left: -48px;
    z-index: 3;
    shape-rendering: crispEdges;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    overflow: visible;
  }
  #cat.flip { transform: scaleX(-1); }
  #cat rect { shape-rendering: crispEdges; }

  #tail {
    animation: tail-sway 2.4s steps(1, end) infinite;
  }
  @keyframes tail-sway {
    0%, 49%, 100% { transform: translate(0, 0); }
    50%, 74% { transform: translate(3px, -3px); }
    75%, 99% { transform: translate(0, -3px); }
  }
  .walking #tail { animation-duration: 0.6s; }
  .zoomies #tail { animation-duration: 0.24s; }

  .eye {
    animation: eyes-open 4.5s steps(1, end) infinite;
  }
  #blink-lines {
    opacity: 0;
    animation: eyes-closed 4.5s steps(1, end) infinite;
  }
  @keyframes eyes-open {
    0%, 93%, 98%, 100% { opacity: 1; }
    94%, 97% { opacity: 0; }
  }
  @keyframes eyes-closed {
    0%, 93%, 98%, 100% { opacity: 0; }
    94%, 97% { opacity: 1; }
  }
  .sleeping .eye { opacity: 0; animation: none; }
  .sleeping #blink-lines { opacity: 1; animation: none; }

  .ear {
    transition: none;
  }
  .bored #ear-l, .sleeping #ear-l { transform: translate(3px, 3px); }
  .bored #ear-r, .sleeping #ear-r { transform: translate(-3px, 3px); }

  #mouth-sad { display: none; }
  .begging #mouth { display: none; }
  .begging #mouth-sad { display: block; }

  #yawn { display: none; transform-box: fill-box; transform-origin: center; }
  .yawning #yawn { display: block; animation: yawn-anim 1.4s steps(1, end); }
  @keyframes yawn-anim {
    0%, 24%, 76%, 100% { transform: scaleY(0); }
    25%, 75% { transform: scaleY(1); }
  }

  .walking #body-group { animation: walk-bob 0.36s steps(1, end) infinite; }
  .zoomies #body-group { animation: walk-bob 0.14s steps(1, end) infinite; }
  @keyframes walk-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  .sleeping #body-group { animation: breathe 2.6s steps(1, end) infinite; }
  @keyframes breathe {
    0%, 100% { transform: translateY(3px); }
    50% { transform: translateY(0); }
  }
  .happy #body-group { animation: wiggle 0.32s steps(1, end) 2; }
  @keyframes wiggle {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
  .sitting #body-group { transform: translateY(3px); }
  .sitting .leg { opacity: 0; }
  .sitting #tail { animation: none; transform: translate(-6px, 6px); }
  .stretching #body-group { animation: stretchy 1.8s steps(1, end); }
  @keyframes stretchy {
    0%, 100% { transform: translate(0, 0); }
    40%, 60% { transform: translate(6px, 3px); }
  }
  .pouncing #body-group { animation: pounce 0.55s steps(1, end); }
  @keyframes pounce {
    0%, 100% { transform: translateY(0); }
    30%, 65% { transform: translateY(-15px); }
  }
  .eating #head {
    animation: munch 0.55s steps(1, end) infinite;
  }
  @keyframes munch {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-3px, 6px); }
  }

  .leg { transition: none; }
  .walking #leg-front { animation: step-a 0.36s steps(1, end) infinite; }
  .walking #leg-back { animation: step-b 0.36s steps(1, end) infinite; }
  .zoomies #leg-front { animation: step-a 0.14s steps(1, end) infinite; }
  .zoomies #leg-back { animation: step-b 0.14s steps(1, end) infinite; }
  @keyframes step-a {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  @keyframes step-b {
    0%, 100% { transform: translateY(-3px); }
    50% { transform: translateY(0); }
  }
  .playing #leg-front {
    animation: bat 0.36s steps(1, end) infinite;
  }
  @keyframes bat {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-6px, -6px); }
  }

  .walking #shadow, .zoomies #shadow { animation: shadow-hop 0.36s steps(1, end) infinite; }
  @keyframes shadow-hop {
    0%, 100% { opacity: 0.24; }
    50% { opacity: 0.12; }
  }

  #zzz {
    position: absolute;
    bottom: 92px;
    right: 30px;
    font-size: 14px;
    font-weight: 700;
    color: #7d8bd4;
    opacity: 0;
    pointer-events: none;
    z-index: 4;
  }
  #zzz.show { opacity: 1; }
  #zzz span {
    display: inline-block;
    animation: floatz 2.2s ease-in-out infinite;
  }
  #zzz span:nth-child(2) { animation-delay: 0.5s; font-size: 11px; }
  #zzz span:nth-child(3) { animation-delay: 1s; font-size: 9px; }
  @keyframes floatz {
    0% { transform: translate(0, 0); opacity: 0; }
    40% { opacity: 1; }
    100% { transform: translate(8px, -16px); opacity: 0; }
  }

  .heart {
    position: absolute;
    font-size: 14px;
    pointer-events: none;
    z-index: 6;
    animation: heart-up 1.1s ease-out forwards;
  }
  @keyframes heart-up {
    0% { transform: translateY(0) scale(0.6); opacity: 1; }
    100% { transform: translateY(-42px) scale(1.15); opacity: 0; }
  }
  .crumb {
    position: absolute;
    font-size: 10px;
    pointer-events: none;
    z-index: 6;
    animation: crumb-fall 0.8s ease-in forwards;
  }
  @keyframes crumb-fall {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(14px); opacity: 0; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble"></div>
  <div id="meters">
    <div class="meter-row"><span>🍗</span><div class="track"><div class="fill" id="fill-hunger"></div></div></div>
    <div class="meter-row"><span>⚡</span><div class="track"><div class="fill" id="fill-energy"></div></div></div>
    <div class="meter-row"><span>🧶</span><div class="track"><div class="fill" id="fill-fun"></div></div></div>
  </div>
  <div id="food">🍗</div>
  <div id="yarn">🧶</div>
  <svg id="cat" viewBox="0 0 32 32" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
    <g id="shadow" fill="#2e2b3d" opacity="0.24">
      <rect x="6" y="30" width="21" height="1"/>
      <rect x="9" y="31" width="15" height="1"/>
    </g>
    <g id="body-group">
      <g id="tail">
        <rect x="24" y="17" width="4" height="10" fill="#2e2b3d"/>
        <rect x="27" y="13" width="3" height="8" fill="#2e2b3d"/>
        <rect x="26" y="11" width="4" height="4" fill="#2e2b3d"/>
        <rect x="25" y="17" width="2" height="9" fill="#d98236"/>
        <rect x="27" y="14" width="2" height="6" fill="#f2a750"/>
        <rect x="27" y="12" width="2" height="3" fill="#f6bd68"/>
      </g>
      <g id="body-shape">
        <rect x="9" y="16" width="15" height="2" fill="#2e2b3d"/>
        <rect x="7" y="18" width="19" height="2" fill="#2e2b3d"/>
        <rect x="6" y="20" width="21" height="7" fill="#2e2b3d"/>
        <rect x="7" y="27" width="19" height="2" fill="#2e2b3d"/>
        <rect x="9" y="18" width="15" height="1" fill="#f6bd68"/>
        <rect x="8" y="19" width="17" height="3" fill="#f2a750"/>
        <rect x="7" y="22" width="19" height="4" fill="#f2a750"/>
        <rect x="8" y="26" width="17" height="2" fill="#d98236"/>
      </g>
      <g id="belly-shape">
        <rect x="11" y="23" width="11" height="4" fill="#ffdca6"/>
        <rect x="13" y="22" width="7" height="1" fill="#ffe9c5"/>
      </g>
      <g id="leg-front" class="leg">
        <rect x="8" y="26" width="5" height="5" fill="#2e2b3d"/>
        <rect x="9" y="26" width="3" height="4" fill="#e99542"/>
        <rect x="9" y="30" width="4" height="1" fill="#ffe9c5"/>
      </g>
      <g id="leg-back" class="leg">
        <rect x="21" y="26" width="5" height="5" fill="#2e2b3d"/>
        <rect x="22" y="26" width="3" height="4" fill="#d98236"/>
        <rect x="21" y="30" width="5" height="1" fill="#ffe9c5"/>
      </g>
      <g id="head">
        <g id="ear-l" class="ear">
          <rect x="5" y="5" width="5" height="7" fill="#2e2b3d"/>
          <rect x="6" y="6" width="3" height="5" fill="#f2a750"/>
          <rect x="7" y="7" width="2" height="3" fill="#ed8f9f"/>
        </g>
        <g id="ear-r" class="ear">
          <rect x="16" y="5" width="5" height="7" fill="#2e2b3d"/>
          <rect x="17" y="6" width="3" height="5" fill="#f2a750"/>
          <rect x="17" y="7" width="2" height="3" fill="#ed8f9f"/>
        </g>
        <g id="head-shape">
          <rect x="4" y="9" width="18" height="3" fill="#2e2b3d"/>
          <rect x="3" y="12" width="20" height="7" fill="#2e2b3d"/>
          <rect x="4" y="19" width="18" height="3" fill="#2e2b3d"/>
          <rect x="5" y="10" width="16" height="3" fill="#f6bd68"/>
          <rect x="4" y="13" width="18" height="6" fill="#f2a750"/>
          <rect x="5" y="19" width="16" height="2" fill="#e99542"/>
          <rect x="8" y="10" width="2" height="2" fill="#d98236"/>
          <rect x="12" y="9" width="2" height="3" fill="#d98236"/>
          <rect x="16" y="10" width="2" height="2" fill="#d98236"/>
        </g>
        <rect x="5" y="17" width="3" height="2" fill="#f59aaa"/>
        <rect x="18" y="17" width="3" height="2" fill="#f59aaa"/>
        <g class="eye"><g id="eye-l">
          <rect x="7" y="13" width="3" height="4" fill="#2e2b3d"/>
          <rect x="8" y="13" width="1" height="1" fill="#fffdf7"/>
        </g></g>
        <g class="eye"><g id="eye-r">
          <rect x="16" y="13" width="3" height="4" fill="#2e2b3d"/>
          <rect x="17" y="13" width="1" height="1" fill="#fffdf7"/>
        </g></g>
        <g id="blink-lines" fill="#2e2b3d">
          <rect x="7" y="15" width="3" height="1"/>
          <rect x="16" y="15" width="3" height="1"/>
        </g>
        <rect x="1" y="16" width="5" height="1" fill="#2e2b3d"/>
        <rect x="2" y="19" width="4" height="1" fill="#2e2b3d"/>
        <rect x="20" y="16" width="5" height="1" fill="#2e2b3d"/>
        <rect x="20" y="19" width="4" height="1" fill="#2e2b3d"/>
        <rect x="12" y="17" width="2" height="1" fill="#de7186"/>
        <g id="mouth" fill="#2e2b3d">
          <rect x="10" y="19" width="2" height="1"/>
          <rect x="14" y="19" width="2" height="1"/>
        </g>
        <g id="mouth-sad" fill="#2e2b3d">
          <rect x="12" y="19" width="2" height="1"/>
          <rect x="10" y="20" width="2" height="1"/>
          <rect x="14" y="20" width="2" height="1"/>
        </g>
        <rect id="yawn" x="11" y="19" width="4" height="2" fill="#b9576d"/>
      </g>
    </g>
  </svg>
  <div id="zzz"><span>z</span><span>z</span><span>z</span></div>
</div>
<script>
  // In Electron the preload exposes window.pet; the no-op fallback keeps the
  // page previewable in a plain browser.
  const petApi = window.pet ?? {
    getBounds: async () => null,
    setPosition: () => {},
    openApp: () => {},
    showMenu: () => {},
    onDo: () => {},
    onCursor: () => {},
  };

  const stage = document.getElementById('stage');
  const cat = document.getElementById('cat');
  const bubble = document.getElementById('bubble');
  const zzz = document.getElementById('zzz');
  const meters = document.getElementById('meters');
  const food = document.getElementById('food');
  const yarn = document.getElementById('yarn');
  const eyeL = document.getElementById('eye-l');
  const eyeR = document.getElementById('eye-r');

  const WIN_W = 200;
  const CAT_CENTER = WIN_W / 2;

  const MESSAGES = [
    'You got this! 💪',
    'One task at a time 🐾',
    'Hydration check 💧',
    'Stretch break soon?',
    'Meow! Keep going ✨',
    'Deep breath... focus 🧘',
    'Proud of you!',
    'Eyes off screen for 20s? 👀',
    'Small steps count 🐾',
  ];
  const PET_REACTIONS = ['Purrrr 💛', 'Meow! 😺', '*happy wiggle*', 'More pets pls', 'I caught you a bug! 🐛'];

  // ============ needs ============
  // hunger/energy/fun: 100 = fully satisfied. Persisted across restarts.
  const NEEDS_KEY = 'tb.pet.needs';
  let needs = { hunger: 80, energy: 90, fun: 70 };
  try {
    const saved = JSON.parse(localStorage.getItem(NEEDS_KEY));
    if (saved && typeof saved.hunger === 'number') {
      needs = { hunger: saved.hunger, energy: saved.energy, fun: saved.fun };
      // Apply offline decay, capped so the cat is never starving after a weekend.
      const awayMin = Math.min((Date.now() - (saved.at || Date.now())) / 60000, 300);
      needs.hunger = Math.max(15, needs.hunger - awayMin * 0.3);
      needs.fun = Math.max(15, needs.fun - awayMin * 0.3);
      needs.energy = Math.min(100, needs.energy + awayMin * 0.5); // it napped while you were gone
    }
  } catch {}
  const clamp01 = (v) => Math.min(100, Math.max(0, v));
  function saveNeeds() {
    try { localStorage.setItem(NEEDS_KEY, JSON.stringify({ ...needs, at: Date.now() })); } catch {}
  }
  function renderMeters() {
    document.getElementById('fill-hunger').style.width = needs.hunger + '%';
    document.getElementById('fill-energy').style.width = needs.energy + '%';
    document.getElementById('fill-fun').style.width = needs.fun + '%';
  }
  renderMeters();

  // ============ window position (the pet walks by moving its own window) ============
  let winX = 0, winY = 0, workArea = null;
  let ready = false;

  async function refreshBounds() {
    const b = await petApi.getBounds();
    if (!b) return;
    winX = b.x; winY = b.y; workArea = b.workArea;
    ready = true;
  }
  refreshBounds();

  function moveWindow(x, y) {
    if (workArea) {
      x = Math.min(Math.max(x, workArea.x - 30), workArea.x + workArea.width - WIN_W + 30);
      y = Math.min(Math.max(y, workArea.y), workArea.y + workArea.height - 175);
    }
    winX = x; winY = y;
    petApi.setPosition(Math.round(x), Math.round(y));
  }

  // ============ speech bubble ============
  let bubbleTimer = null;
  function say(text, ms = 3500) {
    bubble.textContent = text;
    bubble.classList.add('show');
    if (bubbleTimer) clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms);
  }

  // ============ state machine ============
  const VISUAL_CLASSES = ['walking', 'sleeping', 'sitting', 'bored', 'begging', 'eating', 'playing', 'zoomies', 'stretching'];
  let state = 'idle';
  let facing = 1; // 1 = right, -1 = left
  let stateTimer = null;
  let moveTimer = null;
  let fallTimer = null;
  let busy = false;       // interactive sequence (eat/play) in progress
  let afkSleeping = false;
  let dragging = false;

  function setFacing(dir) {
    facing = dir;
    cat.classList.toggle('flip', dir === -1);
  }

  function clearMovement() {
    if (moveTimer) { clearInterval(moveTimer); moveTimer = null; }
  }

  function clearFalling() {
    if (fallTimer) { clearInterval(fallTimer); fallTimer = null; }
  }

  // The pet window is normally grounded at the bottom of its display. When
  // the user lets go after moving it higher, apply a small gravity simulation
  // rather than snapping it down, so it visibly falls back to the desktop.
  function startFalling() {
    clearFalling();
    if (!ready || !workArea) return;

    const groundY = workArea.y + workArea.height - 175;
    if (winY >= groundY - 1) return;

    let velocity = 0;
    let last = performance.now();
    fallTimer = setInterval(() => {
      if (dragging) { last = performance.now(); return; }

      const now = performance.now();
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      velocity = Math.min(velocity + 1900 * dt, 1500);
      const nextY = Math.min(winY + velocity * dt, groundY);
      moveWindow(winX, nextY);

      if (nextY >= groundY) clearFalling();
    }, 16);
  }

  function setState(next) {
    state = next;
    for (const c of VISUAL_CLASSES) cat.classList.remove(c);
    clearMovement();
    zzz.classList.remove('show');
    switch (next) {
      case 'walk':
        cat.classList.add('walking');
        startRoaming(38);
        break;
      case 'zoomies':
        cat.classList.add('zoomies');
        startRoaming(170);
        break;
      case 'sleep':
        cat.classList.add('sleeping');
        zzz.classList.add('show');
        break;
      case 'sit':
        cat.classList.add('sitting');
        break;
      case 'bored':
        cat.classList.add('bored');
        yawnOnce();
        break;
      case 'beg':
        cat.classList.add('begging');
        break;
      case 'stretch':
        cat.classList.add('stretching');
        break;
      case 'chase':
        cat.classList.add('walking');
        startChasing();
        break;
    }
  }

  function yawnOnce() {
    cat.classList.remove('yawning');
    void cat.offsetWidth;
    cat.classList.add('yawning');
    setTimeout(() => cat.classList.remove('yawning'), 1500);
  }

  function startRoaming(speed) {
    if (!ready || !workArea) return;
    let last = performance.now();
    moveTimer = setInterval(() => {
      if (dragging) { last = performance.now(); return; }
      const now = performance.now();
      const dt = (now - last) / 1000;
      last = now;
      let nx = winX + facing * speed * dt;
      const minX = workArea.x + 4;
      const maxX = workArea.x + workArea.width - WIN_W - 4;
      if (nx <= minX) { nx = minX; setFacing(1); }
      if (nx >= maxX) { nx = maxX; setFacing(-1); }
      moveWindow(nx, winY);
    }, 33);
  }

  // ============ cursor: eye tracking + chasing + AFK sleep ============
  let cursor = null;   // absolute screen coords
  let idleSec = 0;

  petApi.onCursor((c) => {
    cursor = c;
    idleSec = c.idle || 0;
    updatePupils();
  });

  function updatePupils() {
    if (!cursor || !ready || state === 'sleep') return;
    const cx = winX + CAT_CENTER;
    const cy = winY + 100;
    const dx = cursor.x - cx;
    const dy = cursor.y - cy;
    const len = Math.hypot(dx, dy) || 1;
    // Eye tracking also stays on the sprite grid: pupils can move exactly one
    // source pixel in each direction, never onto a blurry sub-pixel.
    const px = Math.round(dx / len) * (cat.classList.contains('flip') ? -1 : 1);
    const py = Math.round(dy / len);
    const t = `translate(${px} ${py})`;
    eyeL.setAttribute('transform', t);
    eyeR.setAttribute('transform', t);
  }

  let chaseNear = 0;
  function startChasing() {
    if (!ready || !workArea) return;
    let last = performance.now();
    chaseNear = 0;
    moveTimer = setInterval(() => {
      if (dragging || !cursor) { last = performance.now(); return; }
      const now = performance.now();
      const dt = (now - last) / 1000;
      last = now;
      const diff = cursor.x - (winX + CAT_CENTER);
      if (Math.abs(diff) < 55) {
        chaseNear += dt;
        if (chaseNear > 0.6) { pounce(); return; }
        return;
      }
      chaseNear = 0;
      setFacing(diff > 0 ? 1 : -1);
      moveWindow(winX + Math.sign(diff) * 95 * dt, winY);
    }, 33);
  }

  function pounce() {
    clearMovement();
    cat.classList.remove('walking', 'pouncing');
    void cat.offsetWidth;
    cat.classList.add('pouncing');
    spawnHearts(CAT_CENTER, 60);
    say('Gotcha! 🐾', 1800);
    needs.fun = clamp01(needs.fun + 15);
    setTimeout(() => {
      cat.classList.remove('pouncing');
      if (!busy) { setState('idle'); scheduleSoon(3000); }
    }, 600);
  }

  // ============ behavior scheduler ============
  function pickState() {
    if (needs.energy <= 15) return 'sleep';
    if (needs.hunger <= 20) return 'beg';
    if (needs.fun <= 20) return Math.random() < 0.5 ? 'bored' : 'zoomies';
    const pool = ['idle', 'idle', 'idle', 'walk', 'walk', 'walk', 'sit', 'sit', 'stretch'];
    if (needs.energy < 50) pool.push('sleep', 'sleep');
    if (needs.fun < 45) pool.push('bored');
    if (needs.fun > 35 && cursor && Math.random() < 0.35) pool.push('chase', 'chase');
    if (needs.fun > 55) pool.push('zoomies');
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function durationFor(s) {
    switch (s) {
      case 'sleep': return 20000 + Math.random() * 25000;
      case 'walk': return 5000 + Math.random() * 6000;
      case 'sit': return 5000 + Math.random() * 6000;
      case 'bored': return 5000;
      case 'beg': return 6000;
      case 'stretch': return 2000;
      case 'zoomies': return 3500 + Math.random() * 2000;
      case 'chase': return 8000;
      default: return 4000 + Math.random() * 6000;
    }
  }

  function scheduleSoon(ms) {
    if (stateTimer) clearTimeout(stateTimer);
    stateTimer = setTimeout(tickBehavior, ms);
  }

  function tickBehavior() {
    if (busy || afkSleeping || dragging) { scheduleSoon(2000); return; }
    const next = pickState();
    setState(next);
    if (next === 'beg') say('I’m hungry! Right-click → Feed 🍗', 4500);
    if (next === 'bored') say(['Sooo bored… 🥱', 'Play with me? 🧶', '*stares at you*'][Math.floor(Math.random() * 3)], 3500);
    scheduleSoon(durationFor(next));
  }
  scheduleSoon(2500);

  // ============ needs decay + AFK sleep ============
  setInterval(() => {
    const sleeping = state === 'sleep';
    if (sleeping) {
      needs.energy = clamp01(needs.energy + 0.6);
      needs.hunger = clamp01(needs.hunger - 0.03);
    } else {
      needs.hunger = clamp01(needs.hunger - 0.07);
      needs.fun = clamp01(needs.fun - 0.09);
      needs.energy = clamp01(needs.energy - 0.045);
    }
    renderMeters();

    // Sleep when the user has been away from the keyboard for 4+ minutes.
    if (!afkSleeping && idleSec > 240 && !busy) {
      afkSleeping = true;
      if (stateTimer) clearTimeout(stateTimer);
      setState('sleep');
    } else if (afkSleeping && idleSec < 3) {
      afkSleeping = false;
      setState('idle');
      say('Welcome back! 👋', 3000);
      needs.energy = clamp01(needs.energy + 10);
      scheduleSoon(3000);
    }
  }, 5000);
  setInterval(saveNeeds, 30000);
  window.addEventListener('beforeunload', saveNeeds);

  // ============ feeding ============
  function startFeed() {
    if (busy) return;
    if (needs.hunger > 92) { say('I’m full! 😸', 2500); return; }
    busy = true;
    if (stateTimer) clearTimeout(stateTimer);
    setState('idle');
    setFacing(-1); // the food bowl is on the left
    food.style.transform = '';
    food.classList.add('show');
    setTimeout(() => cat.classList.add('eating'), 400);
    let bites = 0;
    const biteTimer = setInterval(() => {
      bites++;
      spawnCrumbs(34, 138);
      food.style.transform = `scale(${Math.max(0, 1 - bites * 0.33)})`;
      if (bites >= 3) {
        clearInterval(biteTimer);
        cat.classList.remove('eating');
        food.classList.remove('show');
        needs.hunger = 100;
        needs.energy = clamp01(needs.energy + 8);
        renderMeters();
        spawnHearts(CAT_CENTER, 60);
        say('Yum! 😋', 2500);
        busy = false;
        scheduleSoon(3000);
      }
    }, 900);
  }

  // ============ playing (yarn ball) ============
  function startPlay() {
    if (busy) return;
    busy = true;
    if (stateTimer) clearTimeout(stateTimer);
    setState('idle');
    cat.classList.add('playing');
    yarn.classList.add('show', 'spin');
    let side = 0;
    const hop = () => {
      side = 1 - side;
      yarn.style.left = side ? '150px' : '24px';
      setFacing(side ? 1 : -1);
    };
    hop();
    const hopTimer = setInterval(hop, 900);
    setTimeout(() => {
      clearInterval(hopTimer);
      cat.classList.remove('playing');
      yarn.classList.remove('show', 'spin');
      needs.fun = 100;
      needs.energy = clamp01(needs.energy - 8);
      renderMeters();
      spawnHearts(CAT_CENTER, 60);
      say('That was fun! 🐾', 2500);
      busy = false;
      scheduleSoon(3000);
    }, 6500);
  }

  petApi.onDo((action) => {
    if (action === 'feed') startFeed();
    if (action === 'play') startPlay();
  });

  // ============ particles ============
  function spawnHearts(x, y) {
    for (let i = 0; i < 3; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = '💛';
      h.style.left = (x - 8 + (Math.random() * 30 - 15)) + 'px';
      h.style.top = (y - 10 - Math.random() * 10) + 'px';
      h.style.animationDelay = (i * 0.12) + 's';
      stage.appendChild(h);
      setTimeout(() => h.remove(), 1400);
    }
  }
  function spawnCrumbs(x, y) {
    for (let i = 0; i < 2; i++) {
      const c = document.createElement('div');
      c.className = 'crumb';
      c.textContent = '•';
      c.style.color = '#c98a3d';
      c.style.left = (x + Math.random() * 14) + 'px';
      c.style.top = (y + Math.random() * 6) + 'px';
      stage.appendChild(c);
      setTimeout(() => c.remove(), 900);
    }
  }

  // ============ petting (click) ============
  function petTheCat(x, y) {
    if (state === 'sleep' && !afkSleeping) {
      if (stateTimer) clearTimeout(stateTimer);
      setState('idle');
      scheduleSoon(5000);
    }
    cat.classList.remove('happy');
    void cat.offsetWidth;
    cat.classList.add('happy');
    spawnHearts(x, y);
    needs.fun = clamp01(needs.fun + 6);
    renderMeters();
    say(PET_REACTIONS[Math.floor(Math.random() * PET_REACTIONS.length)], 2000);
  }

  // ============ dragging vs clicking ============
  let dragMoved = false;
  let startCursorX = 0, startCursorY = 0, startWinX = 0, startWinY = 0;

  stage.addEventListener('mousedown', async (e) => {
    if (e.button !== 0) return;
    clearFalling();
    await refreshBounds();
    dragging = true; dragMoved = false;
    startCursorX = e.screenX; startCursorY = e.screenY;
    startWinX = winX; startWinY = winY;
    stage.classList.add('dragging');
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.screenX - startCursorX;
    const dy = e.screenY - startCursorY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
    if (dragMoved) moveWindow(startWinX + dx, startWinY + dy);
  });
  window.addEventListener('mouseup', (e) => {
    if (!dragging) return;
    dragging = false;
    stage.classList.remove('dragging');
    if (dragMoved) {
      // Pick up the final, clamped position (and a possible new display) before
      // calculating the floor for gravity.
      void refreshBounds().then(startFalling);
    } else {
      petTheCat(e.clientX, e.clientY);
    }
  });

  stage.addEventListener('dblclick', () => petApi.openApp());
  stage.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    petApi.showMenu();
  });

  // ============ hover meters ============
  let metersTimer = null;
  stage.addEventListener('mouseenter', () => {
    meters.classList.add('show');
    if (metersTimer) clearTimeout(metersTimer);
  });
  stage.addEventListener('mouseleave', () => {
    metersTimer = setTimeout(() => meters.classList.remove('show'), 400);
  });

  // ============ ambient chatter ============
  function scheduleMessage() {
    setTimeout(() => {
      if (state !== 'sleep' && !busy) say(MESSAGES[Math.floor(Math.random() * MESSAGES.length)]);
      scheduleMessage();
    }, 180000 + Math.random() * 180000);
  }
  scheduleMessage();
  setTimeout(() => say('Hi! I’ll keep you company 🐾', 4000), 900);

  // Work-area geometry can change (resolution, taskbar) — refresh periodically.
  setInterval(refreshBounds, 60000);

  // Manual hooks for debugging/preview outside Electron.
  window.__petDebug = { startFeed, startPlay, setState, needs, get state() { return state; } };
</script>
</body>
