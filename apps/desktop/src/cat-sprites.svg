<svg xmlns="http://www.w3.org/2000/svg" width="672" height="32" viewBox="0 0 672 32" shape-rendering="crispEdges">
  <!-- Twenty-one 32x32 frames. Every frame is fully composited here so the
       renderer only ever moves one texture; no body part is animated alone. -->
  <defs>
    <g id="shadow" fill="#2e2b3d" opacity=".24">
      <path d="M6 30h21v1H6zm3 1h15v1H9z"/>
    </g>

    <g id="tail-up">
      <path fill="#2e2b3d" d="M24 17h4v10h-4zm3-6h3v10h-3zm-1-3h4v5h-4z"/>
      <path fill="#d98236" d="M25 17h2v9h-2z"/>
      <path fill="#f2a750" d="M27 12h2v8h-2z"/>
      <path fill="#f6bd68" d="M27 9h2v3h-2z"/>
    </g>
    <g id="tail-mid">
      <path fill="#2e2b3d" d="M24 17h4v10h-4zm3-4h3v8h-3zm-1-2h4v4h-4z"/>
      <path fill="#d98236" d="M25 17h2v9h-2z"/>
      <path fill="#f2a750" d="M27 14h2v6h-2z"/>
      <path fill="#f6bd68" d="M27 12h2v3h-2z"/>
    </g>
    <g id="tail-low">
      <path fill="#2e2b3d" d="M23 23h8v4h-8zm5-3h3v5h-3z"/>
      <path fill="#d98236" d="M24 24h6v2h-6z"/>
      <path fill="#f2a750" d="M29 21h1v4h-1z"/>
    </g>

    <g id="body">
      <path fill="#2e2b3d" d="M9 16h15v2H9zm-2 2h19v2H7zm-1 2h21v7H6zm1 7h19v2H7z"/>
      <path fill="#f6bd68" d="M9 18h15v1H9z"/>
      <path fill="#f2a750" d="M8 19h17v3H8zM7 22h19v4H7z"/>
      <path fill="#d98236" d="M8 26h17v2H8z"/>
      <path fill="#ffdca6" d="M11 23h11v4H11z"/>
      <path fill="#ffe9c5" d="M13 22h7v1h-7z"/>
    </g>
    <g id="body-stretch">
      <path fill="#2e2b3d" d="M8 18h19v2H8zM5 20h24v7H5zm2 7h21v2H7z"/>
      <path fill="#f6bd68" d="M8 20h18v1H8z"/>
      <path fill="#f2a750" d="M6 21h22v5H6z"/>
      <path fill="#d98236" d="M7 26h20v2H7z"/>
      <path fill="#ffdca6" d="M12 23h12v4H12z"/>
    </g>

    <g id="legs-stand">
      <path fill="#2e2b3d" d="M8 26h5v5H8zm13 0h5v5h-5z"/>
      <path fill="#e99542" d="M9 26h3v4H9z"/>
      <path fill="#d98236" d="M22 26h3v4h-3z"/>
      <path fill="#ffe9c5" d="M9 30h4v1H9zm12 0h5v1h-5z"/>
    </g>
    <g id="legs-step-a">
      <path fill="#2e2b3d" d="M7 25h5v5H7zm14 2h6v4h-6z"/>
      <path fill="#e99542" d="M8 25h3v4H8z"/>
      <path fill="#d98236" d="M22 27h4v3h-4z"/>
      <path fill="#ffe9c5" d="M7 29h5v1H7zm9 1h11v1H16z"/>
    </g>
    <g id="legs-step-b">
      <path fill="#2e2b3d" d="M8 27h6v4H8zm14-2h5v5h-5z"/>
      <path fill="#e99542" d="M9 27h4v3H9z"/>
      <path fill="#d98236" d="M23 25h3v4h-3z"/>
      <path fill="#ffe9c5" d="M8 30h11v1H8zm14-1h5v1h-5z"/>
    </g>
    <g id="legs-sit">
      <path fill="#2e2b3d" d="M8 27h7v4H8zm11 0h7v4h-7z"/>
      <path fill="#e99542" d="M9 27h5v3H9z"/>
      <path fill="#d98236" d="M20 27h5v3h-5z"/>
      <path fill="#ffe9c5" d="M8 30h7v1H8zm11 0h7v1h-7z"/>
    </g>
    <g id="legs-play">
      <path fill="#2e2b3d" d="M3 23h10v4H3zm18 3h5v5h-5z"/>
      <path fill="#e99542" d="M4 24h8v2H4z"/>
      <path fill="#d98236" d="M22 26h3v4h-3z"/>
      <path fill="#ffe9c5" d="M3 23h3v1H3zm18 7h5v1h-5z"/>
    </g>
    <g id="legs-dangle">
      <path fill="#2e2b3d" d="M8 25h5v7H8zm13 0h5v7h-5z"/>
      <path fill="#e99542" d="M9 25h3v6H9z"/>
      <path fill="#d98236" d="M22 25h3v6h-3z"/>
      <path fill="#ffe9c5" d="M8 31h5v1H8zm13 0h5v1h-5z"/>
    </g>

    <g id="head-base">
      <path fill="#2e2b3d" d="M5 5h5v7H5zm11 0h5v7h-5zM4 9h18v3H4zm-1 3h20v7H3zm1 7h18v3H4z"/>
      <path fill="#f2a750" d="M6 6h3v5H6zm11 0h3v5h-3zM5 10h16v3H5zM4 13h18v6H4z"/>
      <path fill="#ed8f9f" d="M7 7h2v3H7zm10 0h2v3h-2z"/>
      <path fill="#e99542" d="M5 19h16v2H5z"/>
      <path fill="#d98236" d="M8 10h2v2H8zm4-1h2v3h-2zm4 1h2v2h-2z"/>
      <path fill="#f59aaa" d="M5 17h3v2H5zm13 0h3v2h-3z"/>
      <path fill="#2e2b3d" d="M1 16h5v1H1zm1 3h4v1H2zm18-3h5v1h-5zm0 3h4v1h-4z"/>
      <path fill="#de7186" d="M12 17h2v1h-2z"/>
    </g>
    <g id="face-open">
      <path fill="#2e2b3d" d="M7 13h3v4H7zm9 0h3v4h-3zM10 19h2v1h-2zm4 0h2v1h-2z"/>
      <path fill="#fffdf7" d="M8 13h1v1H8zm9 0h1v1h-1z"/>
    </g>
    <g id="face-closed">
      <path fill="#2e2b3d" d="M7 15h3v1H7zm9 0h3v1h-3zM10 19h2v1h-2zm4 0h2v1h-2z"/>
    </g>
    <g id="face-sad">
      <path fill="#2e2b3d" d="M7 14h3v3H7zm9 0h3v3h-3zM12 19h2v1h-2zm-2 1h2v1h-2zm4 0h2v1h-2z"/>
      <path fill="#fffdf7" d="M8 14h1v1H8zm9 0h1v1h-1z"/>
    </g>
    <g id="face-look-left">
      <path fill="#2e2b3d" d="M7 13h3v4H7zm9 0h3v4h-3zM10 19h2v1h-2zm4 0h2v1h-2z"/>
      <path fill="#fffdf7" d="M7 14h1v1H7zm9 0h1v1h-1z"/>
    </g>
    <g id="face-look-right">
      <path fill="#2e2b3d" d="M7 13h3v4H7zm9 0h3v4h-3zM10 19h2v1h-2zm4 0h2v1h-2z"/>
      <path fill="#fffdf7" d="M9 14h1v1H9zm9 0h1v1h-1z"/>
    </g>
    <g id="face-look-down">
      <path fill="#2e2b3d" d="M7 13h3v4H7zm9 0h3v4h-3zM10 19h2v1h-2zm4 0h2v1h-2z"/>
      <path fill="#fffdf7" d="M8 16h1v1H8zm9 0h1v1h-1z"/>
    </g>
    <g id="face-yawn">
      <path fill="#2e2b3d" d="M7 15h3v1H7zm9 0h3v1h-3z"/>
      <path fill="#b9576d" d="M11 18h4v3h-4z"/>
    </g>
    <g id="head-open"><use href="#head-base"/><use href="#face-open"/></g>
    <g id="head-closed"><use href="#head-base"/><use href="#face-closed"/></g>
    <g id="head-sad"><use href="#head-base"/><use href="#face-sad"/></g>
    <g id="head-yawn"><use href="#head-base"/><use href="#face-yawn"/></g>
    <g id="head-look-left"><use href="#head-base"/><use href="#face-look-left"/></g>
    <g id="head-look-right"><use href="#head-base"/><use href="#face-look-right"/></g>
    <g id="head-look-down"><use href="#head-base"/><use href="#face-look-down"/></g>
  </defs>

  <!-- 0 idle -->
  <g><use href="#shadow"/><use href="#tail-mid"/><use href="#body"/><use href="#legs-stand"/><use href="#head-open"/></g>
  <!-- 1-4 walk cycle -->
  <g transform="translate(32)"><use href="#shadow"/><use href="#tail-low"/><use href="#body"/><use href="#legs-step-a"/><use href="#head-open"/></g>
  <g transform="translate(64)"><use href="#shadow"/><g transform="translate(0 -1)"><use href="#tail-mid"/><use href="#body"/><use href="#legs-stand"/><use href="#head-open"/></g></g>
  <g transform="translate(96)"><use href="#shadow"/><use href="#tail-up"/><use href="#body"/><use href="#legs-step-b"/><use href="#head-open"/></g>
  <g transform="translate(128)"><use href="#shadow"/><g transform="translate(0 -1)"><use href="#tail-mid"/><use href="#body"/><use href="#legs-stand"/><use href="#head-open"/></g></g>
  <!-- 5-6 sleep/breathe -->
  <g transform="translate(160)"><use href="#shadow"/><g transform="translate(0 1)"><use href="#tail-low"/><use href="#body"/><use href="#legs-sit"/><use href="#head-closed"/></g></g>
  <g transform="translate(192)"><use href="#shadow"/><g transform="translate(0 2)"><use href="#tail-low"/><use href="#body"/><use href="#legs-sit"/><use href="#head-closed"/></g></g>
  <!-- 7 sit, 8 stretch, 9 beg -->
  <g transform="translate(224)"><use href="#shadow"/><g transform="translate(0 1)"><use href="#tail-low"/><use href="#body"/><use href="#legs-sit"/><use href="#head-open"/></g></g>
  <g transform="translate(256)"><use href="#shadow"/><use href="#tail-low"/><use href="#body-stretch"/><use href="#legs-step-a"/><g transform="translate(-2 1)"><use href="#head-closed"/></g></g>
  <g transform="translate(288)"><use href="#shadow"/><use href="#tail-up"/><use href="#body"/><use href="#legs-stand"/><use href="#head-sad"/></g>
  <!-- 10-11 play cycle -->
  <g transform="translate(320)"><use href="#shadow"/><use href="#tail-up"/><use href="#body"/><use href="#legs-play"/><g transform="translate(-1)"><use href="#head-open"/></g></g>
  <g transform="translate(352)"><use href="#shadow"/><g transform="translate(0 -2)"><use href="#tail-mid"/><use href="#body"/><use href="#legs-step-a"/><use href="#head-open"/></g></g>
  <!-- 12-13 eat cycle -->
  <g transform="translate(384)"><use href="#shadow"/><use href="#tail-low"/><use href="#body"/><use href="#legs-sit"/><g transform="translate(-3 4)"><use href="#head-open"/></g></g>
  <g transform="translate(416)"><use href="#shadow"/><use href="#tail-low"/><use href="#body"/><use href="#legs-sit"/><g transform="translate(-3 5)"><use href="#head-yawn"/></g></g>
  <!-- 14 carry, 15 pounce -->
  <g transform="translate(448)"><g transform="translate(0 -1)"><use href="#tail-low"/><use href="#body"/><use href="#legs-dangle"/><use href="#head-closed"/></g></g>
  <g transform="translate(480)"><use href="#shadow"/><g transform="translate(0 -4)"><use href="#tail-up"/><use href="#body"/><use href="#legs-step-a"/><use href="#head-open"/></g></g>
  <!-- 16 idle blink, 17 idle yawn -->
  <g transform="translate(512)"><use href="#shadow"/><use href="#tail-mid"/><use href="#body"/><use href="#legs-stand"/><use href="#head-closed"/></g>
  <g transform="translate(544)"><use href="#shadow"/><use href="#tail-mid"/><use href="#body"/><use href="#legs-stand"/><use href="#head-yawn"/></g>
  <!-- 18-20 whole-frame cursor gaze -->
  <g transform="translate(576)"><use href="#shadow"/><use href="#tail-mid"/><use href="#body"/><use href="#legs-stand"/><use href="#head-look-left"/></g>
  <g transform="translate(608)"><use href="#shadow"/><use href="#tail-mid"/><use href="#body"/><use href="#legs-stand"/><use href="#head-look-right"/></g>
  <g transform="translate(640)"><use href="#shadow"/><use href="#tail-mid"/><use href="#body"/><use href="#legs-stand"/><use href="#head-look-down"/></g>
</svg>
