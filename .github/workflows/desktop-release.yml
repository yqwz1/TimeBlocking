name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build web app
        run: npm run build

      - name: Build server bundle
        run: npm -w @timeblock/server run build

      - name: Rebuild native modules for Electron
        run: npm -w @timeblock/desktop run rebuild-native

      - name: Build desktop main process
        run: npm -w @timeblock/desktop run build

      - name: Publish release
        working-directory: apps/desktop
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload and verify differential update assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $version = (Get-Content 'apps/desktop/package.json' | ConvertFrom-Json).version
          $tag = "v$version"
          $release = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          $assets = @($release.assets.name)

          # electron-builder creates the blockmap after publishing the main
          # installer in this workflow, so attach it explicitly when absent.
          if (-not ($assets | Where-Object { $_ -like '*.exe.blockmap' })) {
            $blockMap = Get-ChildItem -LiteralPath 'apps/desktop/release' -Filter '*.exe.blockmap' | Select-Object -First 1
            if ($null -eq $blockMap) {
              throw 'Local NSIS .exe.blockmap was not generated.'
            }
            $uploadUrl = $release.upload_url -replace '\{\?name,label\}$', ''
            $assetName = [uri]::EscapeDataString($blockMap.Name)
            Invoke-RestMethod `
              -Method Post `
              -Headers $headers `
              -ContentType 'application/octet-stream' `
              -InFile $blockMap.FullName `
              -Uri "${uploadUrl}?name=${assetName}"
            $assets += $blockMap.Name
          }

          if ('latest.yml' -notin $assets) {
            throw 'Release is missing latest.yml.'
          }
          if (-not ($assets | Where-Object { $_ -like '*.exe.blockmap' })) {
            throw 'Release is missing the NSIS .exe.blockmap required for differential updates.'
          }
