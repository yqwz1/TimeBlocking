name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build web app
        run: npm run build

      - name: Build server bundle
        run: npm -w @timeblock/server run build

      - name: Rebuild native modules for Electron
        run: npm -w @timeblock/desktop run rebuild-native

      - name: Build desktop main process
        run: npm -w @timeblock/desktop run build

      - name: Normalize historical differential assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          # Older releases used electron-builder's default artifact name. GitHub
          # normalized the installer name with hyphens and the separately uploaded
          # blockmap with dots, while electron-updater requests <installer>.blockmap.
          # Add the correctly named alias before publishing the next release.
          $allReleases = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100"
          foreach ($publishedRelease in $allReleases) {
            $installer = $publishedRelease.assets |
              Where-Object { $_.name -match '\.exe$' } |
              Select-Object -First 1
            if ($null -eq $installer) {
              continue
            }

            $expectedBlockMapName = "$($installer.name).blockmap"
            if ($publishedRelease.assets.name -contains $expectedBlockMapName) {
              continue
            }

            $sourceBlockMap = $publishedRelease.assets |
              Where-Object { $_.name -match '\.exe\.blockmap$' } |
              Select-Object -First 1
            if ($null -eq $sourceBlockMap) {
              Write-Warning "Release $($publishedRelease.tag_name) has no blockmap to normalize."
              continue
            }

            $temporaryBlockMap = Join-Path $env:RUNNER_TEMP "$($publishedRelease.id)-installer.blockmap"
            $downloadHeaders = $headers.Clone()
            $downloadHeaders.Accept = 'application/octet-stream'
            Invoke-WebRequest `
              -Headers $downloadHeaders `
              -Uri $sourceBlockMap.url `
              -OutFile $temporaryBlockMap
            $historicalUploadUrl = $publishedRelease.upload_url -replace '\{\?name,label\}$', ''
            $historicalAssetName = [uri]::EscapeDataString($expectedBlockMapName)
            Invoke-RestMethod `
              -Method Post `
              -Headers $headers `
              -ContentType 'application/octet-stream' `
              -InFile $temporaryBlockMap `
              -Uri "${historicalUploadUrl}?name=${historicalAssetName}"
          }

      - name: Publish release
        working-directory: apps/desktop
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload and verify differential update assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $version = (Get-Content 'apps/desktop/package.json' | ConvertFrom-Json).version
          $tag = "v$version"
          $release = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          $assets = @($release.assets.name)

          $updateManifest = Get-Item -LiteralPath 'apps/desktop/release/latest.yml' -ErrorAction Stop
          $manifestPathMatch = Select-String -LiteralPath $updateManifest.FullName -Pattern '^path:\s*(.+?)\s*$' | Select-Object -First 1
          if ($null -eq $manifestPathMatch) {
            throw 'Updater manifest latest.yml does not contain an installer path.'
          }
          $installerAssetName = $manifestPathMatch.Matches[0].Groups[1].Value.Trim('"', "'")
          $blockMapAssetName = "$installerAssetName.blockmap"
          $blockMap = Get-Item -LiteralPath (Join-Path 'apps/desktop/release' $blockMapAssetName) -ErrorAction Stop

          # electron-builder creates the blockmap after publishing the main
          # installer in this workflow, so attach the exact filename referenced
          # by latest.yml. A differently named blockmap cannot be used by clients.
          if ($blockMapAssetName -notin $assets) {
            $uploadUrl = $release.upload_url -replace '\{\?name,label\}$', ''
            $assetName = [uri]::EscapeDataString($blockMapAssetName)
            Invoke-RestMethod `
              -Method Post `
              -Headers $headers `
              -ContentType 'application/octet-stream' `
              -InFile $blockMap.FullName `
              -Uri "${uploadUrl}?name=${assetName}"
            $assets += $blockMap.Name
          }

          # Upload the updater manifest when electron-builder did not attach it.
          # Without this file, installed clients cannot discover the new release.
          if ('latest.yml' -notin $assets) {
            $uploadUrl = $release.upload_url -replace '\{\?name,label\}$', ''
            $assetName = [uri]::EscapeDataString($updateManifest.Name)
            Invoke-RestMethod `
              -Method Post `
              -Headers $headers `
              -ContentType 'application/octet-stream' `
              -InFile $updateManifest.FullName `
              -Uri "${uploadUrl}?name=${assetName}"
            $assets += $updateManifest.Name
          }

          $release = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          $assets = @($release.assets.name)
          if ($blockMapAssetName -notin $assets) {
            throw "Release is missing the expected differential blockmap: $blockMapAssetName"
          }
          if ('latest.yml' -notin $assets) {
            throw 'Release is missing latest.yml.'
          }
