name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build web app
        run: npm run build

      - name: Build server bundle
        run: npm -w @timeblock/server run build

      - name: Rebuild native modules for Electron
        run: npm -w @timeblock/desktop run rebuild-native

      - name: Build desktop main process
        run: npm -w @timeblock/desktop run build

      - name: Publish release
        working-directory: apps/desktop
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
